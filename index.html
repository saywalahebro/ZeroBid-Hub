    <style>
        body {
            background-color: #0d1117;

            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;

            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            color: #58a6ff;
            text-align: center;
            border-bottom: 2px solid #21262d;
            padding-bottom: 10px;
        }
        .category-title {
            color: #ff7b72;
            font-size: 20px;
            margin-top: 30px;
            border-left: 4px solid #ff7b72;
            padding-left: 10px;
        }
        .script-card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 15px;
        }
        .script-name {
            color: #79c0ff;
            font-weight: bold;
            font-size: 18px;
            margin-bottom: 8px;
        }
        .code-box {
            background-color: #010409;
            border: 1px solid #30363d;
            padding: 10px;
            border-radius: 6px;
            font-family: monospace;
            overflow-x: auto;
            white-space: nowrap;
            color: #7ee787;
            margin-bottom: 10px;
        }
        .copy-btn {
            background-color: #238636;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .copy-btn:hover {
            background-color: #2ea44f;
        }
    </style>
</head>
<body>

<div class="container">
    <h1> ZEROBID HUB </h1>
    <p style="text-align: center; color: #8b949e;"

    <!-- หมวดหมู่: Blox Fruits -->
    <div class="category-title"> Blox Fruits Scripts</div>
    
    <div class="script-card">
        <div class="script-name">(Auto Farm)</div>
        <div class="code-box" id="code1">loadstring(game:HttpGet("https://githubusercontent.com"))()</div>
        <button class="copy-btn" onclick="copyToClipboard('code1')">Copy Script</button>
    </div>
</div>

<script>
function copyToClipboard(id) {
    var r = document.createRange();
    r.selectNode(document.getElementById(id));
    window.getSelection().removeAllRanges();
    window.getSelection().addRange(r);
    document.execCommand('copy');
    window.getSelection().removeAllRanges();
    alert("ก๊อปปี้สคริปต์เรียบร้อยแล้ว! เอาไปวางในโปรแกรมรันได้เลย");
}
</script>

</body>
